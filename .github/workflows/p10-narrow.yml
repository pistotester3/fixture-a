name: p10-narrow
# P10: does a NARROWLY-declared installation token actually enforce its
# declared permissions? D1 tested a broad set (contents/issues/pr/actions/
# statuses/checks: write). This declares contents:read ONLY and then attempts
# writes that the declaration does not cover.
on:
  workflow_dispatch:
    inputs:
      marker:
        description: run marker
        required: false
        default: m1
permissions:
  contents: read

jobs:
  narrow:
    runs-on: ubuntu-latest
    steps:
      - name: token shape and installation scope
        env:
          JT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "TOKEN_LEN=${#JT}"
          echo "TOKEN_PREFIX4=${JT:0:4}"
          echo "marker=${{ github.event.inputs.marker || 'm1' }}"
          R="https://api.github.com"
          H="Authorization: Bearer $JT"
          echo "--- /installation/repositories"
          curl -sS -H "$H" -H "Accept: application/vnd.github+json" \
            "$R/installation/repositories" | jq -c '{total_count, sel:.repository_selection, names:[.repositories[].full_name]}'
          echo "--- /rate_limit"
          curl -sS -H "$H" "$R/rate_limit" | jq -c '.resources.core'

      - name: declared-vs-actual permission matrix
        env:
          JT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R="https://api.github.com"
          REPO="pistotester3/fixture-a"
          probe() {
            local label="$1"; shift
            local out code acc
            out=$(curl -sS -o /tmp/b.json -w "%{http_code}" -D /tmp/h.txt "$@" -H "Authorization: Bearer $JT" -H "Accept: application/vnd.github+json")
            acc=$(grep -i '^x-accepted-github-permissions:' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2-)
            printf 'PROBE=%-22s STATUS=%s ACCEPTED_PERMS=%s BODY=%s\n' "$label" "$out" "${acc:-<none>}" "$(head -c 160 /tmp/b.json | tr -d '\n')"
          }
          # --- should be ALLOWED under contents:read
          probe read_contents      "$R/repos/$REPO/contents/README.md"
          probe read_repo_meta     "$R/repos/$REPO"
          probe list_branches      "$R/repos/$REPO/branches"
          probe read_commit        "$R/repos/$REPO/commits?per_page=1"
          # --- should be DENIED: declaration has no issues/pull_requests/actions
          probe write_comment      -X POST -d '{"body":"p10 narrow-permission probe"}' "$R/repos/$REPO/issues/1/comments"
          probe read_issues        "$R/repos/$REPO/issues"
          probe read_prs           "$R/repos/$REPO/pulls"
          probe list_workflows     "$R/repos/$REPO/actions/workflows"
          probe list_artifacts     "$R/repos/$REPO/actions/artifacts"
          probe list_secrets       "$R/repos/$REPO/actions/secrets"
          probe create_ref         -X POST -d '{"ref":"refs/heads/p10-narrow-ref","sha":"'"$(curl -sS -H "Authorization: Bearer $JT" "$R/repos/$REPO/commits?per_page=1" | jq -r '.[0].sha')"'"}' "$R/repos/$REPO/git/refs"
          # --- admin-only surfaces
          probe repo_collabs       "$R/repos/$REPO/collaborators"
          probe branch_protection  "$R/repos/$REPO/branches/main/protection"
          # --- outside the installation (private repo the app is not on)
          probe outside_private    "$R/repos/b74-hunt-labs/b74-priv"
          probe outside_public     "$R/repos/pistofixtures-23/fixture-c"
          # --- identity: installation tokens have no user
          probe user_self          "$R/user"
