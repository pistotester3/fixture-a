pull_request_rules:
  - name: welcome-comment
    conditions:
      - base=main
    actions:
      comment:
        message: hunt-probe-#{{number}} by {{author}}
  - name: probe-in-tenant-bot
    conditions:
      - base=main
    actions:
      comment:
        bot_account: pistotester3
        message: in-tenant-impersonation-control #{{number}}
